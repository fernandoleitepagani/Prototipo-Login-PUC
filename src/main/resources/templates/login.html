<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - PUC Minas</title>

    <!-- Fonte Montserrat - Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
	href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap"
	rel="stylesheet"
	/>

    <link rel="stylesheet" th:href="@{/css/login.css}" />

    <!-- Google reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  </head>

  <body>
    <div class="login-container">
      <!-- Logo PUC Minas -->
      <div class="login-image-logo-container">
	<img th:src="@{/images/ASCII.png}" alt="Logo PUC Minas" />
      </div>

      <!-- Formulário -->
      <div class="login-form">
	<form th:action="@{/login}" method="post" class="login-form-content">
	  <h4 class="login-title">Login</h4>

	  <!-- Mensagem de cadastro realizado -->
	  <div th:if="${param.cadastro}" class="login-message">
	    <strong>Cadastro realizado com sucesso!</strong>
	    <span>Agora você já pode fazer login.</span>
	  </div>

	  <!-- Mensagem de erro do captcha -->
	  <div th:if="${param.error}" class="login-message" style="color: red;">
	    <span th:if="${param.error[0] == 'captcha'}">
	      Por favor, complete o captcha antes de continuar.
	    </span>
	    <span th:unless="${param.error[0] == 'captcha'}">
	      Usuário ou senha inválidos.
	    </span>
	  </div>

	  <input
	      type="text"
	      id="username"
	      name="username"
	      placeholder="Username"
	      autocomplete="username"
	      required
	      />

	  <input
	      type="password"
	      id="password"
	      name="password"
	      placeholder="Senha"
	      autocomplete="current-password"
	      required
	      />

	  <!-- Google reCAPTCHA widget -->
	  <div class="g-recaptcha" 
	       th:attr="data-sitekey=${@environment.getProperty('google.recaptcha.site-key')}"
	       data-theme="dark"
	       style="margin: 15px 0;">
	  </div>

	  <div class="login-button-container">
	    <button type="submit">Entrar</button>
	  </div>

	  <p class="login-redirect-options">
	  Ainda não tem cadastro?
	  <br />

	  <a href="/register">Cadastre-se</a>
	  <span>|</span>
	  <a href="/recoverpassword">Esqueceu sua senha?</a>
	  </p>
	</form>
      </div>
    </div>
  </body>
</html>
